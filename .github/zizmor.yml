rules:
  forbidden-uses:
    config:
      allow:
        - actions/checkout
        - actions/create-github-app-token
        - actions/setup-python
        - adrienverge/yamllint
        - astral-sh/setup-uv
        - astral-sh/ruff-pre-commit
        - codespell-project/codespell
        - hacs/action
        - home-assistant/actions/hassfest
        - pre-commit/pre-commit-hooks
        - zizmorcore/zizmor-action
        - zizmorcore/zizmor-pre-commit

  stale-action-refs:
    ignore:
      # These upstream validation actions do not publish version tags; the workflows still pin exact commits.
      - validate.yml:68
      - validate.yml:82

  unpinned-uses:
    config:
      policies:
        "*": hash-pin
