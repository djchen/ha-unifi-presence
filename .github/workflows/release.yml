name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without v prefix (X.Y.Z)
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release workflow must be dispatched from main."
            exit 1
          fi

          python - <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          import os

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              sys.exit("Version must be SemVer core X.Y.Z without v prefix, prerelease/build metadata, or leading zeros.")

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          manifest_version = json.loads(Path("custom_components/unifi_presence/manifest.json").read_text())["version"]
          if pyproject_version != manifest_version:
              sys.exit(f"Version metadata mismatch: pyproject={pyproject_version}, manifest={manifest_version}")

          def parse(value: str) -> tuple[int, int, int]:
              return tuple(int(part) for part in value.split("."))

          if parse(version) <= parse(pyproject_version):
              sys.exit(f"Requested version {version} must be greater than current version {pyproject_version}.")
          PY

      # Requires APP_CLIENT_ID and APP_PRIVATE_KEY secrets for the release GitHub App.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for duplicates
        id: duplicate-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          branch="release/$tag"
          git fetch origin +refs/tags/*:refs/tags/*

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 1
          fi

          open_pr_count=$(
            gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json isCrossRepository,number \
              --jq '[.[] | select(.isCrossRepository == false)] | length'
          )
          if [ "$open_pr_count" != "0" ]; then
            echo "Open release PR already exists for $branch; no changes needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "Remote branch $branch exists without an open PR."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update version metadata
        if: steps.duplicate-check.outputs.skip != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          import os

          version = os.environ["VERSION"]
          pyproject = Path("pyproject.toml")
          manifest = Path("custom_components/unifi_presence/manifest.json")

          pyproject_lines = pyproject.read_text().splitlines(keepends=True)
          in_project = False
          py_count = 0
          for index, line in enumerate(pyproject_lines):
              if re.fullmatch(r"\s*\[project]\s*\n?", line):
                  in_project = True
                  continue
              if in_project and re.fullmatch(r"\s*\[.+]\s*\n?", line):
                  in_project = False
              if in_project and re.fullmatch(r'(version\s*=\s*)"[^"]+"(\s*)', line):
                  pyproject_lines[index] = re.sub(r'^(version\s*=\s*)"[^"]+"(\s*)$', rf'\1"{version}"\2', line)
                  py_count += 1
          if py_count != 1:
              sys.exit("Expected exactly one pyproject.toml [project] version line to update.")
          pyproject.write_text("".join(pyproject_lines))

          manifest_text = manifest.read_text()
          manifest_text, manifest_count = re.subn(
              r'(?m)^(\s*"version"\s*:\s*)"[^"]+"(\s*,?\s*)$',
              rf'\1"{version}"\2',
              manifest_text,
              count=1,
          )
          if manifest_count != 1:
              sys.exit("Expected exactly one manifest.json version line to update.")
          manifest.write_text(manifest_text)

          parsed_pyproject = tomllib.loads(pyproject.read_text())["project"]["version"]
          parsed_manifest = json.loads(manifest.read_text())["version"]
          if parsed_pyproject != version or parsed_manifest != version:
              sys.exit("Updated metadata does not match requested version.")
          PY

          uv lock

      - name: Create release pull request
        if: steps.duplicate-check.outputs.skip != 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          branch="release/$tag"
          title="chore: prepare $tag release"
          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          <!-- ha-unifi-presence-release:$tag -->

          ## Summary

          - Bumps version metadata in pyproject.toml, custom_components/unifi_presence/manifest.json, and uv.lock.
          EOF

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add pyproject.toml custom_components/unifi_presence/manifest.json uv.lock
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --repo "$REPOSITORY" --base main --head "$branch" --title "$title" --body-file "$body_file"

  publish:
    name: Create Draft Release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate merged release PR
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          head_ref = os.environ["HEAD_REF"]
          body = os.environ["PR_BODY"]
          merge_commit_sha = os.environ["MERGE_COMMIT_SHA"]

          match = re.fullmatch(r"release/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))", head_ref)
          if not match:
              sys.exit("Release PR head branch must match release/vX.Y.Z.")

          version = match.group(1)
          tag = f"v{version}"
          marker = f"<!-- ha-unifi-presence-release:{tag} -->"
          if marker not in body:
              sys.exit("Release PR body marker does not match the head branch version.")

          if not merge_commit_sha:
              sys.exit("Merge commit SHA is required.")

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          manifest_version = json.loads(Path("custom_components/unifi_presence/manifest.json").read_text())["version"]
          if pyproject_version != version or manifest_version != version:
              sys.exit("Checked-out metadata does not match release version.")
          PY

      # Requires APP_CLIENT_ID and APP_PRIVATE_KEY secrets for the release GitHub App.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Check for duplicate release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${HEAD_REF#release/}"
          git fetch origin +refs/tags/*:refs/tags/*

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${HEAD_REF#release/}"
          gh release create "$tag" --repo "$REPOSITORY" --draft --generate-notes --title "$tag" --target "$MERGE_COMMIT_SHA"
