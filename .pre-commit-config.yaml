repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The venv includes Home Assistant's uv dependency; use it only as a runner.
        entry: uv run --no-config --locked --no-sync mypy
        args: [--strict, custom_components/unifi_presence/]
        language: system
        types: [python]
        files: ^custom_components/
        pass_filenames: false
