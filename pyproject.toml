[project]
name = "ha-unifi-presence"
version = "0.10.0"
description = "Home Assistant custom integration for UniFi presence detection"
license = {text = "Apache-2.0"}
requires-python = ">=3.14.5"

[dependency-groups]
dev = [
    "aiounifi==91",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.unifi_presence",
    "--cov-report=term-missing",
    "--cov-fail-under=98",
]

[tool.ruff]
line-length = 120
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "PL"]
ignore = [
    "D100",    # Missing docstring in public module (we have file-level docstrings)
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__ (we document __init__ in class docstrings)
    "D203",    # No blank line before class (conflicts with D211)
    "D212",    # Multi-line summary first line (conflicts with D213)
    "PLR0913", # Too many arguments (create_controller needs 7)
    "PLR2004", # Magic value comparisons
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
known-first-party = ["custom_components.unifi_presence"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
