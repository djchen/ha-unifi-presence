[project]
name = "ha-unifi-presence"
version = "0.11.0"
description = "Home Assistant custom integration for UniFi presence detection"
license = "Apache-2.0"
requires-python = ">=3.14.5"

[dependency-groups]
dev = [
    "aiounifi==94",
    "mypy",
    "prek==0.4.14",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_debug = true
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = [
    "--cov=custom_components.unifi_presence",
    "--cov-report=term-missing",
    "--cov-fail-under=98",
]

[tool.ruff]
line-length = 120
fix = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "BLE",
    "D",
    "DTZ",
    "E",
    "F",
    "G",
    "I",
    "LOG",
    "PERF",
    "PL",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TID251",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ASYNC109", # Async function with a timeout parameter
    "ASYNC110", # Async busy-wait with sleep
    "D100",    # Missing docstring in public module (we have file-level docstrings)
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__ (we document __init__ in class docstrings)
    "D203",    # No blank line before class (conflicts with D211)
    "D212",    # Multi-line summary first line (conflicts with D213)
    "PLR0913", # Too many arguments (create_controller needs 7)
    "PLR2004", # Magic value comparisons
    "TRY003",  # Long exception messages
    "TRY400",  # Use logging.exception instead of logging.error
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
known-first-party = ["custom_components.unifi_presence"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
